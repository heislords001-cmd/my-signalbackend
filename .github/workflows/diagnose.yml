# Diagnostics only. Runs when you press "Run workflow" in the Actions tab. It does not trade or publish signals.
name: diagnose

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python diagnose.py
        env:
          FEED: yahoo
